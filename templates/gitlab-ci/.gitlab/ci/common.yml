# =============================================================================
# Common GitLab CI configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Global variables
# -----------------------------------------------------------------------------
#
# GIT_STRATEGY: none
#   GitLab does not clone the repository: the clone is done manually in job:init.
#
# PYTHONNOUSERSITE: "1"
#   Prevent Python from loading packages from the user site directory.
#
# BUILD_JOBS: number of parallel compile jobs.
# CTEST_JOBS: number of tests allowed to run in parallel inside each test job.
#
# PRTE_MCA_hwloc_default_binding_policy, OMPI_MCA_hwloc_base_binding_policy: "none"
#   MPI ranks not bound to cores. Open MPI binds the ranks of each mpirun (or mpiexec)
#   starting at core 0, without knowing about the other runs at the same time (ctest
#   --parallel, and the jobs side by side on the runner): every test piled up on the first
#   cores, a one-rank test (mpiexec -np 1) with all its threads on core 0. Not bound, the OS
#   spreads them over the node (numbat: 131 s bound, 81 s not bound; its C++ tests went over
#   900 s bound). Open MPI 5 reads the PRTE_MCA_ name, Open MPI 4 the OMPI_MCA_ one. The
#   project's test/CMakeLists.txt sets them in the ENVIRONMENT of its tests too, for a local
#   ctest --parallel (CLAUDE.md, Build and dependencies).

variables:
  GIT_STRATEGY: none
  PYTHONNOUSERSITE: "1"

  BUILD_JOBS: "24"
  CTEST_JOBS: "8"
  PRTE_MCA_hwloc_default_binding_policy: "none"
  OMPI_MCA_hwloc_base_binding_policy: "none"


# -----------------------------------------------------------------------------
# Default settings for all jobs
# -----------------------------------------------------------------------------

default:
  tags:
    - juno-shell

  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.onera.net


# =============================================================================
# Reusable templates
# =============================================================================

# -----------------------------------------------------------------------------
# Module loading (hidden job, reused with `extends: .with_hpc_modules`)
# -----------------------------------------------------------------------------
#
# The environment must provide (no virtual environment is created by the CI):
#   - a C++20 compiler (GCC >= 11 or clang >= 14) and CMake >= 3.25;
#   - Python >= 3.12 with numpy, pybind11 >= 2.12 (or the external/pybind11 submodule, or
#     network access for CMake to fetch it),
#     pytest, mpi4py (pytest_parallel plugin loaded by source.sh), pybind11-stubgen (or the
#     external/pybind11-stubgen submodule);
#   - the mpirun (or mpiexec) of the loaded MPI on the PATH: every Python process that imports
#     an MPI module runs through `mpiexec -np 1`, the serial tests and the documentation too
#     (Open MPI cannot start a lone process on every juno node: "Error obtaining unique
#     transport key from PMIX");
#   - for the documentation: the "doc" dependency group of pyproject.toml, installed by job:doc
#     in a venv;
#   - for job:lint: ruff and basedpyright.
# Keep this list of modules in sync with source_juno.sh and modulefiles/pomac/juno-socle7.

.with_hpc_modules:
  before_script:
    # Some system modules may fail to unload: keep the job going in that case.
    - module purge || true
    # Same toolchain in every job (build, tests, documentation).
    - module load socle-cfd/7.0-gnu850-ompi502
    - module load cmake/3.29.3
    # Debug information, useful while stabilizing the CI.
    - echo "CMake used by this job:" && which cmake && cmake --version
    - echo "C++ compiler used by this job:" && which g++ && g++ --version
    - echo "Python used by this job:" && which python3 && python3 --version
    - echo "MPI launcher used by this job:" && (which mpirun || which mpiexec || true)

# -----------------------------------------------------------------------------
# Test job template
# -----------------------------------------------------------------------------
#
# Each test job defines CTEST_LABEL, a prefix of the ctest names:
#
#   ctest -R "${CTEST_R_PATTERN:-^${CTEST_LABEL}.*}"
#
# pomac's tests are selected by name (create_doctest / create_pytest of project_utils
# do not set CTest labels): pomac_doctest_*, pomac_pytest_*, pomac_stubs_*, pomac_doc_*.
# A project with several ctest tests of one kind gives each its job (dspod:
# job:test-python with dspod_pytest_serial, job:test-python-parallel with
# dspod_pytest_parallel), so that a red job names the failing one.
#
# Optional tools (jobs of the quality stage): a job lists the Python modules its tests need
# in OPTIONAL_PYTHON_MODULES.
# If one is missing, CMake did not register those tests, and the job exits with code 3,
# declared as an allowed failure by the quality jobs (warning in the pipeline, with the
# missing module named). The test jobs do not allow any failure.

.test_template:
  stage: test
  extends: .with_hpc_modules

  # job:init: dotenv artifact defining CUSTOM_CI_DIR and BUILD_DIR.
  # job:build: ordering only; the build tree stays in the shared Jacamar filesystem.
  needs:
    - job: job:init
      artifacts: true
    - job: job:build
      artifacts: false

  script:
    - set -e
    - cd "${BUILD_DIR}"
    # Runtime environment generated by the build (PYTHONPATH, LOGGING_CONF_FILE...).
    - source source.sh
    - |
      # a submodule counts as installed: external/pybind11-stubgen (cmake/stubs.py puts it on PYTHONPATH)
      submodule_paths="${CUSTOM_CI_DIR}/external/pybind11-stubgen:"
      for module in ${OPTIONAL_PYTHON_MODULES}; do
        if ! PYTHONPATH="${submodule_paths}${PYTHONPATH:-}" python3 -c "import ${module}" 2>/dev/null; then
          echo "Python module ${module} is not installed: the ${CTEST_LABEL} tests are skipped"
          exit 3
        fi
      done
    - echo "ctest selection -R ${CTEST_R_PATTERN:-^${CTEST_LABEL}.*} ${CTEST_E_PATTERN:+-E ${CTEST_E_PATTERN}}"
    - |
      ctest -R "${CTEST_R_PATTERN:-^${CTEST_LABEL}.*}" ${CTEST_E_PATTERN:+-E "${CTEST_E_PATTERN}"} \
      --no-tests=error \
      --parallel "${CTEST_JOBS}" \
      --output-on-failure \
      --output-junit "${CI_PROJECT_DIR}/junit-${CTEST_LABEL}.xml"

  artifacts:
    # Upload the test report even if tests fail.
    when: always
    reports:
      junit: "junit-*.xml"
