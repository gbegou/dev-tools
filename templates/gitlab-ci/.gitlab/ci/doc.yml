# =============================================================================
# STAGE: DOC, DEPLOY
# =============================================================================
#
# The documentation is built in its own build directory,
#
#   ${CUSTOM_CI_DIR}/build-doc
#
# because enabling it reconfigures the project: doing it in ${BUILD_DIR} while the
# test jobs read from it would be a race condition.

job:doc:
  stage: doc
  extends: .with_hpc_modules

  needs:
    - job: job:init
      artifacts: true
    - job: job:build
      artifacts: false

  # Branches with an open merge request, and dev (deployed to the pages).
  rules:
    - if: '$CI_OPEN_MERGE_REQUESTS || $CI_COMMIT_BRANCH == "dev"'

  # Sphinx, the theme and the extensions are installed in a temporary venv built from the
  # loaded python3 (the "doc" dependency group of pyproject.toml), as job:lint does.
  # exit code 3 (allowed failure, warning): the venv or the installation failed (e.g. no network)
  allow_failure:
    exit_codes: 3
  variables:
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  cache:
    key: "${CI_JOB_NAME}-pip"
    paths:
      - .cache/pip

  script:
    - set -e
    - echo "Using $(command -v python3) ($(python3 --version))"
    - DOC_VENV="$(mktemp -d)/venv"
    - |
      if ! python3 -m venv --system-site-packages "${DOC_VENV}"; then
        echo "Cannot create venv with $(command -v python3): documentation skipped"
        exit 3
      fi
    - source "${DOC_VENV}/bin/activate"
    - |
      doc_deps=$(python -c 'import tomllib; print(" ".join(tomllib.load(open("'"${CUSTOM_CI_DIR}"'/pyproject.toml", "rb"))["dependency-groups"]["doc"]))')
      if ! python -m pip install --quiet ${doc_deps}; then
        echo "Cannot install ${doc_deps}: documentation skipped"
        exit 3
      fi
    - python -m sphinx --version
    - DOC_BUILD_DIR="${CUSTOM_CI_DIR}/build-doc"
    - |
      cmake -S "${CUSTOM_CI_DIR}" -B "${DOC_BUILD_DIR}" \
      -DCMAKE_BUILD_TYPE=Debug \
      -Dpomac_ENABLE_DOCUMENTATION=ON \
      -Dpomac_ENABLE_TESTS=OFF \
      -DPython_EXECUTABLE="$(command -v python)"
    # Environment generated by the documentation build (cpomac on the PYTHONPATH).
    - cd "${DOC_BUILD_DIR}"
    - source source.sh
    # pomac_sphinx depends on cpomac: the module is compiled in build-doc first.
    - cmake --build "${DOC_BUILD_DIR}" --target pomac_sphinx --parallel "${BUILD_JOBS}"
    # Kept for the pages job (the Jacamar workspace is shared, but not with GitLab pages).
    - rm -rf "${CI_PROJECT_DIR}/doc-html"
    - cp -r "${DOC_BUILD_DIR}/doc/sphinx/html" "${CI_PROJECT_DIR}/doc-html"

  artifacts:
    paths:
      - doc-html
    expire_in: 1 week


# Deploy the documentation of dev to the GitLab pages
pages:
  stage: deploy

  needs:
    - job: job:doc
      artifacts: true

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  # exit code 3 (allowed failure, warning): job:doc skipped the documentation
  allow_failure:
    exit_codes: 3

  script:
    - |
      if [ ! -d doc-html ]; then
        echo "no documentation built by job:doc, nothing to deploy"
        exit 3
      fi
    - rm -rf public
    - mkdir -p public
    - cp -r doc-html public/dev
    - |
      cat > public/index.html << EOF
      <head>
        <meta http-equiv='refresh' content='0; URL=dev/index.html'>
      </head>
      EOF

  artifacts:
    paths:
      - public
